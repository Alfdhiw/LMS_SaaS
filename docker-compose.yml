name: lms-saas-local

x-laravel-app: &laravel-app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: lms-saas-php:8.4-local
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
  env_file:
    - .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *laravel-app
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lms_saas}
      POSTGRES_USER: ${DB_USERNAME:-lms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_TEST_DB: ${DB_TEST_DATABASE:-lms_saas_test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *laravel-app
    user: www-data
    command: ["php", "artisan", "queue:work", "redis", "--sleep=2", "--tries=3", "--timeout=90"]
    restart: unless-stopped

  scheduler:
    <<: *laravel-app
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"

  vite:
    image: node:22-alpine
    profiles: ["assets"]
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]

volumes:
  postgres_data:
  redis_data:
