# Optional LOCAL override. Copy to docker-compose.override.yml only after the
# owner secret has been moved outside the application bind mount.
services:
  db:
    entrypoint: ["/bin/sh", "/opt/lms/audit-local-db-entrypoint.sh"]
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: null
    volumes:
      - ./docker/postgres/audit-local-db-entrypoint.sh:/opt/lms/audit-local-db-entrypoint.sh:ro
    secrets:
      - postgres_owner_password

secrets:
  postgres_owner_password:
    file: ../.lms-saas-secrets/postgres_owner_password
