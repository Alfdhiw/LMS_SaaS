name: M0 checks
on:
  push:
  pull_request:

jobs:
  private-database-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Pull PostgreSQL for isolated test
        run: docker pull postgres:17-alpine
      - name: Test private database helper with synthetic data
        shell: pwsh
        run: ./tests/Support/m1-private-database-test.ps1
      - name: Test SCRAM operators and rollback with synthetic data
        shell: pwsh
        run: ./tests/Support/m1-scram-synthetic-test.ps1

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require committed Composer lockfile
        run: test -f composer.lock && git ls-files --error-unmatch composer.lock
      - name: Setup official Laravel skeleton and services
        run: bash scripts/setup.sh
      - name: PHP coding standard
        run: docker compose exec -T app ./vendor/bin/pint --test
      - name: All tests
        run: docker compose exec -T app php artisan test
      - name: Service status
        if: always()
        run: docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Cleanup
        if: always()
        run: docker compose down -v
